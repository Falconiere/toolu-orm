# release-plz: on every push to main it opens/updates a release PR (workspace
# version bump + CHANGELOG.md). Merging that PR publishes the six crates to
# crates.io in dependency order, then pushes one `vX.Y.Z` tag and one GitHub
# Release. Workflow: .github/workflows/release-plz.yml.

[workspace]
# All crates share `version.workspace = true`, so one changelog and one tag.
changelog_path = "./CHANGELOG.md"
git_tag_enable = false
git_release_enable = false

# Tag/release hang off orm-cli: it sits at the end of a dependency chain
# (core + connection), so the tag lands after those are on the registry.
# The `toolu-orm` facade is a separate leaf and may publish either side of
# it; a partial failure is resumed by the next run on main.
#
# `git_tag_name` MUST stay on this package and never move to `[workspace]`.
# release-plz decides whether a package is already released by looking for
# its tag, so a workspace-wide `v{{ version }}` template makes every crate
# share one tag name: the tag from the last release then marks a crate added
# afterwards as "already published", `release` silently skips publishing it,
# and `release-pr` dies with "package `x` not found in the registry, but the
# git tag vX.Y.Z exists". Every other crate keeps the default
# `{{ package }}-v{{ version }}` name, which is never created here, so their
# released state is read from crates.io — the only source that is per-crate.
[[package]]
name = "toolu-orm-cli"
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
git_tag_enable = true
git_release_enable = true

[changelog]
body = """

## `{{ package }}` - [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
{%- if commit.scope -%}
- *({{commit.scope}})* {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% else -%}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% endif -%}
{% endfor -%}
{% endfor -%}
"""
