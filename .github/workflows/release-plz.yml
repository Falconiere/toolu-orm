# Automated crates.io releases (config: release-plz.toml).
#
#   release-plz-pr      — on push to main, opens/updates the release PR
#                         (version bump + CHANGELOG.md).
#   release-plz-release — on push to main, when that push merged a release PR
#                         (head branch `release-plz-*`, see `release_always`
#                         in release-plz.toml), publishes every crate whose
#                         Cargo.toml version is not yet on crates.io, then
#                         tags vX.Y.Z and creates the GitHub Release.
#                         No-op otherwise.
#
# The PR job `needs` the release job. They used to run in parallel: the PR job
# read crates.io before the publish landed, decided the just-merged version was
# still unreleased, and opened a duplicate release PR (#55). A failed publish
# now also skips the PR job on purpose: a release PR opened on top of a
# half-published version is a stale duplicate (#53), not a recovery.
#
# Uses the default GITHUB_TOKEN, so the release PR does not trigger the CI
# workflow (GitHub suppresses runs for events raised by GITHUB_TOKEN). The PR
# only touches versions and the changelog; `cargo publish` still verifies
# each crate builds before upload.

name: Release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: release-plz/action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f # v0.5.133
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    needs: release-plz-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: release-plz/action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f # v0.5.133
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
