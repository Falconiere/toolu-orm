name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Live Postgres for the postgres lane (service container below). The
  # password comes from the TEST_DB_PASSWORD secret when the repository sets
  # one; otherwise the throwaway service uses the documented default.
  TEST_DB_HOST: localhost
  TEST_DB_PORT: "5432"
  TEST_DB_USER: toolu
  TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'toolu' }}

jobs:
  rust:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toolu
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'toolu' }}
          POSTGRES_DB: toolu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toolu -d toolu"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Format check
        run: cargo fmt --all -- --check

      # Lane 1, default features: what a plain `cargo build` in this repo
      # compiles (orm-core and orm-cli default to libsql; orm-query has no
      # driver, so only its SQL-generation tests run here).
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (default features)
        run: cargo nextest run --workspace

      # Lane 2, postgres: orm-core gets postgres+libsql (the FromRow derive
      # shape) and orm-query gets postgres alone (its Postgres executor). Runs
      # every live-Postgres suite against the service container, plus the
      # facade-only consumer's FromRow derive.
      - name: Clippy (postgres)
        run: cargo clippy -p toolu-orm -p toolu-orm-core -p toolu-orm-macros -p toolu-orm-query -p toolu-orm-connection -p toolu-orm-cli -p toolu-orm-facade-consumer --features postgres --all-targets -- -D warnings

      - name: Test (postgres)
        run: cargo nextest run -p toolu-orm -p toolu-orm-core -p toolu-orm-macros -p toolu-orm-query -p toolu-orm-connection -p toolu-orm-cli -p toolu-orm-facade-consumer --features postgres

      # Lane 3, libsql-only: orm-query with libsql as its sole driver, which is
      # the only way its libsql executor, transaction, and fetch code compiles.
      - name: Clippy (orm-query, libsql only)
        run: cargo clippy -p toolu-orm-query --features libsql --all-targets -- -D warnings

      - name: Test (orm-query, libsql only)
        run: cargo nextest run -p toolu-orm-query --features libsql

      # Lane 4, rusqlite-only: the sync executor in orm-query and the rusqlite
      # connection in orm-connection.
      - name: Clippy (orm-query, rusqlite only)
        run: cargo clippy -p toolu-orm-query --features rusqlite --all-targets -- -D warnings

      - name: Test (orm-query, rusqlite only)
        run: cargo nextest run -p toolu-orm-query --features rusqlite

      - name: Clippy (orm-connection, rusqlite only)
        run: cargo clippy -p toolu-orm-connection --features rusqlite --all-targets -- -D warnings

      - name: Test (orm-connection, rusqlite only)
        run: cargo nextest run -p toolu-orm-connection --features rusqlite

      # docs/scenarios must name real tests, and every test in a scenario
      # binary must be documented.
      - name: Scenario docs in sync
        run: bash scripts/check-scenario-docs.sh
