name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write # SARIF upload to the Code Scanning tab

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Nothing to review on a release-plz PR: it is a version bump plus a
    # generated changelog, and reviewing that diff has only ever produced
    # findings that block the release.
    if: ${{ !startsWith(github.head_ref, 'release-plz-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: falconiere/toolu-ghactions/code-review@v7
        with:
          PROVIDER: openrouter
          MODEL_ID: deepseek/deepseek-v4-pro
          API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # .claude/ is agent scratch, never shipped code.
          EXCLUDE_GLOBS: .claude/**

  # The `merge-gate` required check: the PR carries `merge-approved` and every
  # review thread has a reply from someone other than its opener. Evaluated
  # after the reviewer has posted, so a push is never judged against the
  # previous commit's findings; merge-gate.yml re-evaluates it on thread replies
  # and label changes. `!cancelled()`, not `always()`: a red `review` still
  # gets a verdict, but a run superseded by a newer push does not.
  # release-plz branches are exempt exactly as `review` is: release PRs are not
  # reviewed, so they never get the label, and a skipped check passes.
  merge-gate:
    needs: review
    if: ${{ !cancelled() && !github.event.pull_request.draft && !startsWith(github.event.pull_request.head.ref, 'release-plz-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: falconiere/toolu-ghactions/merge-gate@v8
