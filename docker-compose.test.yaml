services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: toolu
      POSTGRES_PASSWORD: toolu
      POSTGRES_DB: toolu
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolu -d toolu"]
      interval: 2s
      timeout: 3s
      retries: 15
