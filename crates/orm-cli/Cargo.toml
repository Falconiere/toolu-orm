[package]
name = "toolu-orm-cli"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Migration CLI (generate, migrate, status) for toolu-orm"
autotests = false

[dependencies]
toolu-orm-core = { path = "../orm-core", version = "0.4.2", default-features = false }
toolu-orm-connection = { path = "../orm-connection", version = "0.4.2", default-features = false }
libsql = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }
thiserror = "2"

[features]
default = ["libsql"]
libsql = ["dep:libsql", "toolu-orm-core/libsql", "toolu-orm-connection/libsql"]
rusqlite = [
  "dep:rusqlite",
  "toolu-orm-core/rusqlite",
  "toolu-orm-connection/rusqlite",
]
postgres = [
  "dep:tokio-postgres",
  "toolu-orm-core/postgres",
  "toolu-orm-connection/postgres",
]

[[test]]
name = "migrate_test"
path = "tests/migrate_test.rs"
required-features = ["libsql", "postgres"]

[[test]]
name = "status_test"
path = "tests/status_test.rs"
required-features = ["libsql", "postgres"]

[[test]]
name = "generate_test"
path = "tests/generate_test.rs"

[[test]]
name = "migrations_table_ddl_test"
path = "tests/migrations_table_ddl_test.rs"

[[test]]
name = "migration_loop_sqlite_test"
path = "tests/migration_loop_sqlite_test.rs"
required-features = ["libsql"]

# Needs a live Postgres (docker-compose.test.yaml).
[[test]]
name = "migration_loop_postgres_test"
path = "tests/migration_loop_postgres_test.rs"
required-features = ["libsql", "postgres"]

[[test]]
name = "fts5_loop_sqlite_test"
path = "tests/fts5_loop_sqlite_test.rs"
required-features = ["libsql"]

[[test]]
name = "fts5_content_rebuild_sqlite_test"
path = "tests/fts5_content_rebuild_sqlite_test.rs"
required-features = ["libsql"]

[[test]]
name = "vec0_loop_sqlite_test"
path = "tests/vec0_loop_sqlite_test.rs"
required-features = ["libsql"]

[[test]]
name = "migrate_failure_test"
path = "tests/migrate_failure_test.rs"
required-features = ["libsql"]

[[test]]
name = "migrate_baseline_test"
path = "tests/migrate_baseline_test.rs"
required-features = ["libsql"]

[[test]]
name = "migrate_embedded_test"
path = "tests/migrate_embedded_test.rs"
required-features = ["libsql"]

# Needs a live Postgres (docker-compose.test.yaml).
[[test]]
name = "migrate_embedded_postgres_test"
path = "tests/migrate_embedded_postgres_test.rs"
required-features = ["libsql", "postgres"]

# Needs a live Postgres (docker-compose.test.yaml).
[[test]]
name = "migrate_baseline_postgres_test"
path = "tests/migrate_baseline_postgres_test.rs"
required-features = ["libsql", "postgres"]

[[test]]
name = "migrate_embedded_baseline_test"
path = "tests/migrate_embedded_baseline_test.rs"
required-features = ["libsql"]

# Needs a live Postgres on TEST_DB_PORT (5434 in CI). Does not start Docker.
[[test]]
name = "migrate_embedded_baseline_postgres_test"
path = "tests/migrate_embedded_baseline_postgres_test.rs"
required-features = ["libsql", "postgres"]

[[test]]
name = "migrate_blocking_test"
path = "tests/migrate_blocking_test.rs"
required-features = ["rusqlite"]

[[test]]
name = "migrate_embedded_blocking_test"
path = "tests/migrate_embedded_blocking_test.rs"
required-features = ["rusqlite"]

[[test]]
name = "migrate_baseline_blocking_test"
path = "tests/migrate_baseline_blocking_test.rs"
required-features = ["rusqlite"]

[[test]]
name = "status_blocking_test"
path = "tests/status_blocking_test.rs"
required-features = ["rusqlite"]

[dev-dependencies]
tempfile = "3"
toolu-orm-macros = { path = "../orm-macros", default-features = false }
# `#[table]` expansions reference toolu_orm_query builder types.
toolu-orm-query = { path = "../orm-query", default-features = false }
# Tests only. `#[tokio::test]` needs `macros` for the attribute and `rt` for
# the current-thread Runtime it builds to drive each test. src/ names no tokio
# API: its async fns are driven by whoever calls them, and the one runtime
# service they lean on (spawn_blocking) is declared by toolu-orm-connection.
tokio = { workspace = true, features = ["rt", "macros"] }
tokio-postgres = { workspace = true }
libsql = { workspace = true }

[lints]
workspace = true
