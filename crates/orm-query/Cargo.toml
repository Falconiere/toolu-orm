# Binary relation columns: SQL generation and JSON decoding only, no driver
# type in either binary, so both belong in the feature-less default lane
# (`cargo nextest run --workspace`). Declaring `required-features` here would
# take them OUT of the only lane that runs them. Their live counterparts are
# `{rusqlite,libsql,postgres}_relational_blob_test` below.
[[test]]
name = "relational_binary_sql_test"
path = "tests/relational_binary_sql_test.rs"

[[test]]
name = "relational_binary_decode_test"
path = "tests/relational_binary_decode_test.rs"

[[test]]
name = "select_test"
path = "tests/select_test/main.rs"

# Pure SQL generation for the scalar-expression surface: no driver type in the
# binary, so it belongs in the feature-less default lane. Its live twins are
# {rusqlite,libsql,postgres}_scalar_expr_test below.
[[test]]
name = "scalar_expr_sql_test"
path = "tests/scalar_expr_sql_test.rs"

# Pure SQL generation for the explicit conflict clause and RETURNING: no
# driver type in the binary, so it belongs in the feature-less default lane.
# Its live twins are {rusqlite,libsql,postgres}_upsert_test below.
[[test]]
name = "upsert_sql_test"
path = "tests/upsert_sql_test/main.rs"

# Pure SQL generation for UPDATE/DELETE RETURNING and the ON CONFLICT WHERE
# clauses. No driver type, so it belongs in the feature-less default lane.
# Its live twins are rusqlite_mutation_parity_test and postgres_mutation_parity_test.
[[test]]
name = "mutation_parity_sql_test"
path = "tests/mutation_parity_sql_test.rs"

# Pure SQL generation for DISTINCT / GROUP BY / HAVING and the grouped count:
# no driver type in the binary, so it belongs in the feature-less default lane.
# Its live twins are {rusqlite,libsql,postgres}_grouping_test below.
[[test]]
name = "grouping_sql_test"
path = "tests/grouping_sql_test/main.rs"

# Pure SQL generation for CTEs, set operations, subqueries and table-valued
# FROM sources: no driver type in the binary, so it belongs in the feature-less
