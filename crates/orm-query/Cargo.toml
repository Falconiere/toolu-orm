[package]
name = "toolu-orm-query"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Type-safe query builders for toolu-orm"
autotests = false

[dependencies]
toolu-orm-core = { path = "../orm-core", version = "0.10.0", default-features = false }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
# `sync` for the tokio::sync::Mutex in transaction.rs (libsql only).
tokio = { workspace = true, features = ["sync"], optional = true }

# Driver dependencies — mutually exclusive per consumer
libsql = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }
toolu-orm-sqlite-vec-register = { path = "../orm-connection/sqlite-vec-register", version = "0.10.0", optional = true }
toolu-orm-connection = { path = "../orm-connection", version = "0.10.0", optional = true, default-features = false }

[features]
default = []
libsql = ["dep:libsql", "dep:tokio", "toolu-orm-core/libsql"]
rusqlite = [
  "dep:rusqlite",
  "toolu-orm-core/rusqlite",
  "dep:toolu-orm-connection",
  "toolu-orm-connection/rusqlite",
]
postgres = [
  "dep:tokio-postgres",
  "toolu-orm-core/postgres",
]
# Live sqlite-vec lane: implies rusqlite + register helper + from_connection.
sqlite-vec = [
  "rusqlite",
  "dep:toolu-orm-sqlite-vec-register",
  "dep:toolu-orm-connection",
  "toolu-orm-connection/rusqlite",
]

[dev-dependencies]
# `macros` for #[tokio::test]; `rt` for its runtime and for tokio::spawn in the
# postgres fixtures.
tokio = { workspace = true, features = ["rt", "macros"] }
serde = { version = "1", features = ["derive"] }
toolu-orm-macros = { path = "../orm-macros", default-features = false }
toolu-orm-core = { path = "../orm-core", default-features = false }
tokio-postgres = { workspace = true }

