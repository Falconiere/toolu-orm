[package]
name = "toolu-orm-connection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Connection pooling and driver adapters (libsql, rusqlite, Postgres) for toolu-orm"

[dependencies]
toolu-orm-core = { path = "../orm-core", version = "0.4.1", default-features = false, features = [] }
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

# Adds to the workspace entry's `core`; these four gate `build_synced_db`'s
# `Builder::new_synced_database` and `Database::sync`. No other crate needs them.
libsql = { workspace = true, optional = true, features = ["remote", "replication", "sync", "tls"] }
rusqlite = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
postgres-types = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
toolu-orm-sqlite-vec-register = { path = "sqlite-vec-register", version = "0.4.1", optional = true }

[features]
default = []
libsql = ["dep:libsql", "toolu-orm-core/libsql"]
rusqlite = ["dep:rusqlite", "toolu-orm-core/rusqlite"]
postgres = [
  "dep:tokio-postgres",
  "dep:deadpool-postgres",
  "dep:postgres-types",
  "dep:tokio-postgres-rustls",
  "dep:rustls",
  "dep:rustls-native-certs",
  "toolu-orm-core/postgres",
]
# Statically linked sqlite-vec for live vec0 suites (register helper only;
# SelectBuilder live KNN lives in orm-query's `sqlite-vec` feature).
sqlite-vec = ["dep:toolu-orm-sqlite-vec-register"]

[dev-dependencies]
tokio-postgres = { workspace = true }
libsql = { workspace = true }
toolu-orm-macros = { path = "../orm-macros", default-features = false }

[lints]
workspace = true
