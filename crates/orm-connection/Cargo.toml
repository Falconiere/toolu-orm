[package]
name = "toolu-orm-connection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Connection pooling and driver adapters (libsql, rusqlite, Postgres) for toolu-orm"

[dependencies]
toolu-orm-core = { path = "../orm-core", version = "0.11.0", default-features = false, features = [] }
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
# `rt` for spawn_blocking / JoinError (rusqlite_impl/), `time` for the libsql
# retry backoff (libsql_impl.rs), `sync` for the rusqlite connection's
# `Semaphore` admission gate (rusqlite_impl/connection.rs). Test-only features
# are in dev-deps.
tokio = { workspace = true, features = ["rt", "time", "sync"] }

# Adds to the workspace entry's `core`; these four gate `build_synced_db`'s
# `Builder::new_synced_database` and `Database::sync`. No other crate needs them.
libsql = { workspace = true, optional = true, features = ["remote", "replication", "sync", "tls"] }
rusqlite = { workspace = true, optional = true }
duckdb = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
postgres-types = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
toolu-orm-sqlite-vec-register = { path = "sqlite-vec-register", version = "0.11.0", optional = true }

[features]
default = []
libsql = ["dep:libsql", "toolu-orm-core/libsql"]
rusqlite = ["dep:rusqlite", "toolu-orm-core/rusqlite"]
postgres = [
  "dep:tokio-postgres",
  "dep:deadpool-postgres",
  "dep:postgres-types",
  "dep:tokio-postgres-rustls",
  "dep:rustls",
  "dep:rustls-native-certs",
  "toolu-orm-core/postgres",
]
lancedb = ["dep:duckdb", "toolu-orm-core/lancedb"]
# Statically linked sqlite-vec for live vec0 suites (register helper only;
# SelectBuilder live KNN lives in orm-query's `sqlite-vec` feature).
sqlite-vec = ["dep:toolu-orm-sqlite-vec-register"]

[dev-dependencies]
# `macros` for #[tokio::test]; `rt-multi-thread` for the multi_thread-flavor
# test in tests/rusqlite_blocking_concurrency_test.rs and for the
# examples/rusqlite_prepared_statement_bench.rs runtime.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-postgres = { workspace = true }
libsql = { workspace = true }
toolu-orm-macros = { path = "../orm-macros", default-features = false }

# Release benchmark for issue #88: compares uncached/cached rusqlite
# statement preparation, and the blocking vs async RusqliteConnection paths.
[[example]]
name = "rusqlite_prepared_statement_bench"
path = "examples/rusqlite_prepared_statement_bench.rs"
required-features = ["rusqlite"]

# Release benchmark for issue #90: contended throughput and blocking-thread
# usage, gated async path vs the pre-change spawn_blocking-first shape.
[[example]]
name = "rusqlite_async_backpressure_bench"
path = "examples/rusqlite_async_backpressure_bench.rs"
required-features = ["rusqlite"]

[lints]
workspace = true
